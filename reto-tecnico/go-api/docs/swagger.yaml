basePath: /
definitions:
  main.Credentials:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  main.MatrixRequest:
    properties:
      matrix:
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: API que procesa y rota matrices rectangulares protegida con JWT.
  title: API en Go - Interseguro Challenge
  version: "1.0"
paths:
  /api/process-matrix:
    post:
      consumes:
      - application/json
      description: Recibe una matriz de números, la rota 90 grados y la reenvía a
        Node.js
      parameters:
      - description: Matriz de entrada
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.MatrixRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Recibe y rota una matriz (Protegido con JWT)
  /login:
    post:
      consumes:
      - application/json
      description: Autentica al usuario y devuelve un token JWT válido
      parameters:
      - description: Credenciales de acceso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión para obtener Token JWT
securityDefinitions:
  BearerAuth:
    description: 'Escribe ''Bearer '' seguido de tu token JWT generador en /login
      (Ejemplo: Bearer eyJhbGci...).'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
